# Project Athena — nginx config
#
# Served from this image: the built SPA at /usr/share/nginx/html.
# Reverse-proxied to the API service:
#   /api/*     → FastAPI
#   /health    → FastAPI
#   /model     → FastAPI
#   /metrics   → FastAPI (admin-gated at the app layer)
#
# Drop this into /etc/nginx/conf.d/default.conf (the file at
# /etc/nginx/conf.d/default.conf in the official nginx image is loaded by
# the main /etc/nginx/nginx.conf).
#
# TLS: this config is plain HTTP for the dev compose (which publishes :8080).
# For a production deployment, mount a cert + key at the paths referenced
# below and uncomment the TLS server block — and also restore the
# HTTP→HTTPS redirect in the first server block.

upstream athena_api {
    server api:8000;
    keepalive 32;
}

# --- Security headers (reused by every location) ---
# Map used so we can apply headers on both static and proxied locations
# without duplicating them and risking override-by-add_header semantics.
map $sent_http_content_type $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";
}

# --- App: plain HTTP on 8080 (dev) ---
server {
    # Listen on both IPv4 and IPv6 so the container's own healthcheck
    # (which often resolves `localhost` to `::1`) succeeds.
    listen 80;
    listen [::]:80 default_server;
    server_name _;

    # Security headers applied to every response (including errors).
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options          "DENY"             always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  $csp_header        always;

    # Allow ~30MB uploads (backend cap is 25MB; small headroom).
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Static assets: long-lived cache ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback: every other path serves index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API reverse proxy ---
    # SSE-friendly: disable buffering, long read timeout.
    location /api/ {
        proxy_pass         http://athena_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # --- Ops endpoints ---
    # /metrics is admin-gated at the FastAPI layer (AdminUser dependency).
    location = /health  { proxy_pass http://athena_api/health;  }
    location = /model   { proxy_pass http://athena_api/model;   }
    location = /metrics { proxy_pass http://athena_api/metrics; }

    # --- Error pages (serve the SPA so React Router can render 404/500) ---
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}

