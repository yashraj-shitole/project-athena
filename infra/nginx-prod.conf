# Project Athena — production nginx config
#
# Served from this image: the built SPA at /usr/share/nginx/html.
# Reverse-proxied to the API service:
#   /api/*     → FastAPI
#   /health    → FastAPI
#   /model     → FastAPI
#   /metrics   → FastAPI
#
# Drop this into /etc/nginx/conf.d/default.conf (the file at
# /etc/nginx/conf.d/default.conf in the official nginx image is loaded by
# the main /etc/nginx/nginx.conf).

upstream athena_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Allow ~30MB uploads (backend cap is 25MB; small headroom).
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Static assets: long-lived cache ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback: every other path serves index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API reverse proxy ---
    # SSE-friendly: disable buffering, long read timeout.
    location /api/ {
        proxy_pass         http://athena_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # --- Ops endpoints ---
    location = /health  { proxy_pass http://athena_api/health;  }
    location = /model   { proxy_pass http://athena_api/model;   }
    location = /metrics { proxy_pass http://athena_api/metrics; }

    # --- Error pages (serve the SPA so React Router can render 404/500) ---
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
