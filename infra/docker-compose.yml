# Project Athena — full stack
#
# Bring everything up with:
#   docker compose up -d --build
#
# After the first start, the LLM model is downloaded into the `ollama_data`
# volume by the one-shot `ollama-pull` service. Subsequent restarts skip
# the download.
#
# Ports exposed on the host (all bound to 127.0.0.1 — they are NOT published
# on the public interface; the nginx SPA on :80 is the only public entry):
#   8080 → nginx (SPA + reverse proxy to API)
#   8000 → API (direct, useful for curl / debugging; loopback-only)
#   5432 → Postgres (loopback-only; never expose to the network)
#   6379 → Redis  (loopback-only)
#   11434 → Ollama (loopback-only)
#
# Secrets: every password / secret is read from the environment with a
# *development-only* default that the API rejects in production mode
# (see app/core/config.py fail-fast). Override ATHENA_POSTGRES_PASSWORD,
# ATHENA_JWT_SECRET, etc. via a real .env file or orchestrator secrets
# for any non-local deployment.
#
# To attach to logs:
#   docker compose logs -f api nginx
# To stop and wipe data:
#   docker compose down -v
#
# Developer scripts (preferred): the repo-root build.ps1 / docker-up.ps1 /
# test.ps1 / debug-all.ps1 and the goThrough/ suite wrap the commands below
# with env validation, health waits, and a consistent project name. They set
# COMPOSE_PROJECT_NAME=athena; the explicit `name:` below keeps manual runs
# consistent with scripted ones (volumes become athena_pgdata, etc.).

name: athena

services:
  # -----------------------------------------------------------------------
  # Postgres + pgvector + tsvector
  # -----------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: athena-postgres
    environment:
      POSTGRES_USER: ${ATHENA_POSTGRES_USER:-athena}
      POSTGRES_PASSWORD: ${ATHENA_POSTGRES_PASSWORD:-athena-dev-only}
      POSTGRES_DB: ${ATHENA_POSTGRES_DB:-athena}
    # Loopback-only — never publish the DB on a public interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ATHENA_POSTGRES_USER:-athena}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Redis (cache + counters)
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: athena-redis
    # Loopback-only — Redis has no auth and must not be reachable off-host.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Ollama (long-running)
  # -----------------------------------------------------------------------
  ollama:
    # Pin a digest-tagged image instead of :latest so the deployed image
    # is reproducible and can't silently change under us.
    image: ollama/ollama:0.3.14
    container_name: athena-ollama
    # NOTE: the host's port 11434 is intentionally NOT published. The
    # container's ollama process listens on 11434 *inside* its own
    # network namespace, and the API/ollama-pull services reach it as
    # `http://ollama:11434` over the docker network. Publishing the
    # port conflicts with a native ollama on the host and is never
    # required (we don't expect a user to curl ollama directly).
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # `ollama list` is the in-binary equivalent of GET /api/tags and
      # avoids depending on wget/curl, neither of which is in the bare
      # `ollama/ollama:*` runtime image.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # One-shot model pull (uses the same ollama_data volume)
  # -----------------------------------------------------------------------
  ollama-pull:
    image: ollama/ollama:0.3.14
    container_name: athena-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      ATHENA_OLLAMA_MODEL: ${ATHENA_OLLAMA_MODEL:-qwen2.5:1.5b-instruct}
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-pull.sh:/ollama-pull.sh:ro
    entrypoint: ["/bin/sh", "/ollama-pull.sh"]
    restart: "no"

  # -----------------------------------------------------------------------
  # Backend API (built from the root Dockerfile's `api` target)
  # -----------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    container_name: athena-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ATHENA_DATABASE_URL: postgresql+asyncpg://${ATHENA_POSTGRES_USER:-athena}:${ATHENA_POSTGRES_PASSWORD:-athena-dev-only}@postgres:5432/${ATHENA_POSTGRES_DB:-athena}
      ATHENA_REDIS_URL: redis://redis:6379/0
      ATHENA_OLLAMA_URL: http://ollama:11434
      ATHENA_OLLAMA_MODEL: ${ATHENA_OLLAMA_MODEL:-qwen2.5:1.5b-instruct}
      ATHENA_STORAGE_DIR: /app/storage
      # Dev-only default that satisfies the strength validator
      # (>= 32 bytes, high entropy). The dev/CI environments are
      # walled off from the public internet anyway. For any
      # non-local deploy, set ATHENA_JWT_SECRET to a strong,
      # unique secret via your .env file or orchestrator secrets.
      # config.py fail-fasts on known-insecure values when
      # ATHENA_ENV != dev/test.
      ATHENA_JWT_SECRET: ${ATHENA_JWT_SECRET:-dev-only-jwt-secret-32-bytes-long-please-change-me-now}
      ATHENA_TOKEN_BUDGET: "3000"
      ATHENA_LOG_LEVEL: ${ATHENA_LOG_LEVEL:-INFO}
      # Comma-separated list of allowed origins. The default is a dev-only
      # localhost value; config.py rejects localhost in CORS origins when
      # running in production mode.
      ATHENA_CORS_ORIGINS: ${ATHENA_CORS_ORIGINS:-["http://localhost:8080"]}
      ATHENA_ENV: ${ATHENA_ENV:-dev}
    volumes:
      - api_storage:/app/storage
    # M-25 — container hardening:
    # * ``read_only: true`` — the container's root filesystem is
    #   immutable; only the storage volume and the OS-managed
    #   tmpfs (below) are writable. A compromised API process
    #   cannot write to /app, /etc, or anywhere else.
    # * ``tmpfs`` for /tmp, /var/run, /root/.cache (the
    #   sentence-transformers model cache).
    # * ``security_opt`` drops the container's Linux
    #   capabilities; ``no-new-privileges`` blocks setuid
    #   binaries from re-acquiring capabilities.
    # * ``pids_limit`` caps the process tree at 256 to blunt a
    #   fork-bomb from a runaway dependency.
    read_only: true
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /var/run:size=16M,mode=0755
      - /root/.cache:size=512M,mode=0755
      # M-25 (revised) — allow `pip install --user` for ad-hoc
      # debugging tools (e.g. ``debugpy`` to attach a remote
      # debugger). The user's site-packages land in
      # ``/home/athena/.local``; without this tmpfs the read-only
      # rootfs blocks the install (Errno 30). The mount is 256M,
      # capped at the api container's own uid, and is wiped on
      # every container restart — so any tool installed at
      # runtime has to be re-installed for each debugging
      # session, which is exactly the dev-loop we want (no
      # surprise tools surviving into a fresh boot).
      - /home/athena/.local:size=256M,uid=1000,gid=1000,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # uvicorn binds :8000
    pids_limit: 256
    # Loopback-only — direct API access is for local debugging only.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # nginx: serves the SPA + reverse-proxies the API.
  # The static bundle is built in the same multi-stage Dockerfile, so
  # `docker compose build` produces a single image that contains both
  # the SPA and the nginx config.
  # -----------------------------------------------------------------------
  nginx:
    build:
      context: ..
      dockerfile: Dockerfile
      target: nginx
    container_name: athena-nginx
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Optional: Vite dev server with HMR.
  #   docker compose --profile dev up web-dev
  #   Then open http://localhost:5173.
  # -----------------------------------------------------------------------
  web-dev:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: web-dev
    container_name: athena-web-dev
    environment:
      VITE_API_TARGET: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      # Live-reload: mount the source so edits on the host show up in the
      # container. node_modules is named-volumed so the host's modules
      # don't override the container's.
      - ../frontend:/app
      - webdev_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
  api_storage:
  webdev_node_modules: