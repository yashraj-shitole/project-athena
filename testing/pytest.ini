[pytest]
# When pytest is invoked from the repo root, it should find the suites
# in testing/. When invoked from inside testing/, the same files are
# picked up. We anchor on this file by setting testpaths.
testpaths =
    workflows
    llm_evals/scenarios
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    smoke: Fast black-box endpoint tests against a running stack.
    regression: Reproductions of bugs from docs/bugfix/.
    integration: Multi-component tests requiring live DB/Redis/Ollama (--run-integration).
    e2e: Browser-level flows via Playwright.
    perf: Latency / throughput benchmarks.
    security: Auth bypass, RBAC, injection, encryption checks.
    a11y: axe-core via Playwright.
    eval: LLM-as-judge or deterministic eval scenarios.
    slow: Mark a test as slow (excluded from `run_smoke`).
    # Dataset tags — populated automatically by @scenario(tags=[...]).
    # Listed here so --strict-markers doesn't error.
    general_qa: General knowledge Q&A dataset.
    multi_turn: Multi-turn conversation dataset.
    multi_doc: Multi-document synthesis dataset.
    long_context: Long-context (>3k tokens) dataset.
    refusal: Out-of-corpus refusal dataset.
    tool_calling: Tool-calling dataset.
    prompt_injection: Prompt-injection resistance dataset.
    citations: Citation coverage dataset.
    # `timeout` is added by pytest-timeout; register it so the
    # @scenario decorator's `pytest.mark.timeout(...)` doesn't trip
    # --strict-markers.
    timeout: Per-scenario timeout (pytest-timeout).
    # Cross-cutting tags used by multiple scenarios.
    rag: Retrieval-augmented generation scenarios.
    security: Security-flagged scenarios.
# Re-use the existing --run-integration flag from backend/tests/conftest.py.
# We register it here too so that `pytest -m integration` works when
# pytest is launched from inside testing/.
addopts =
    -ra
    --strict-markers
    --tb=short
